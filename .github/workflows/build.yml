name: Build Yesmin AI APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          # Agar zip ka naam Yesmin-ai.zip hai toh yehi rahega
          unzip -o Yasmin-ai.zip -d extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        run: |
          # Project folder ke andar move karein
          cd extracted_project
          
          # Agar gradlew file pehle se nahi hai, tab gradle wrapper generate karein
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          
          # Permissions set karein aur debug build banayein
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yesmin-AI-APK
          path: extracted_project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
