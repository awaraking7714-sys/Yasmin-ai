name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip Yasmin-ai.zip -d extracted_project
        # Find the actual directory containing gradlew automatically
        cd extracted_project
        PROJECT_DIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Gradle
      run: |
        cd extracted_project/${{ env.PROJECT_DIR }}
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: extracted_project/**/app/build/outputs/apk/debug/app-debug.apk
        
